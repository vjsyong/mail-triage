# ===========================================================================
# Mail Triage — example local LLM server (single GPU)
# ===========================================================================
# Standalone, self-contained serving stack for the model this project was
# developed against (a 26B-A4B MoE quantized to AWQ-4bit), trimmed to ONE
# replica on one card. Mail Triage talks to any OpenAI-compatible API; this
# file is an EXAMPLE — vLLM, ollama, llama.cpp or a hosted API all work.
# Hardware tiers and alternatives: docs/getting-started.md.
#
#   Model:     gemma-4-26b-a4b-awq-4bit (compressed-tensors AWQ)
#   Engine:    vLLM v0.22.0 + vendored PR #40391 overlay (int8_per_token_head
#              KV on Ampere; stock v0.22.0 cannot serve this KV dtype — skip
#              the overlay for models/quants that do not need it)
#   Topology:  one 24GB card (validated on an RTX 3090), TP=1
#   Drafter:   none · Vision: off · Max ctx: 32768 (mail workload)
#   Mem util:  0.96
#
# Weights:   point HF_HOME at a host directory that holds the model (or a
#            HuggingFace cache); it is mounted as the container's HF cache.
#            For gated models export HF_TOKEN.
#
# Usage (from this directory):
#   HF_HOME=$HOME/models docker compose up -d
#   docker compose logs -f        # watch boot ("Application startup complete")
#   curl -s localhost:8040/v1/models
#
# Point Mail Triage at it via .env:
#   LLM_BASE_URL=http://<this-host>:8040/v1   LLM_MODEL=gemma-4-26b-a4b
# ===========================================================================
name: mail-triage-gemma

services:
  gemma:
    image: vllm/vllm-openai:v0.22.0
    container_name: mail-triage-gemma
    restart: unless-stopped
    shm_size: "16gb"
    ipc: host
    ports:
      - "8040:8000"
    volumes:
      - ${HF_HOME:-./cache/hf}:/root/.cache/huggingface
      - ./chat_template.jinja:/etc/mail-triage-gemma/chat-template.jinja:ro
      - ./patches/vllm-pr40391-v0.22.0:/etc/mail-triage-gemma/pr40391:ro
      - ./cache/torch_compile_int8:/root/.cache/vllm/torch_compile_cache
      - ./cache/triton_int8:/root/.triton/cache
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${OFFLINE:-0}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_NO_USAGE_STATS=1
      - OMP_NUM_THREADS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - TRITON_CACHE_DIR=/root/.triton/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              # Pick your card (CDI), or use the classic form:
              #   - driver: nvidia
              #     count: 1
              #     capabilities: [gpu]
              device_ids:
                # GPU 0 (PCI 01:00.0) is in a failed state ("Unknown Error",
                # NVML nvmlDeviceGetHandleByIndex); run on the healthy RTX 3090.
                - nvidia.com/gpu=1
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        bash /etc/mail-triage-gemma/pr40391/install.sh
        exec vllm serve "$@"
      - --
    command:
      - --override-generation-config
      - '{"temperature":${TEMP:-1.0},"top_p":${TOP_P:-0.95},"top_k":${TOP_K:-64},"min_p":${MIN_P:-0.0},"repetition_penalty":${REPEAT_PENALTY:-1.0}}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - /root/.cache/huggingface/gemma-4-26b-a4b-awq-4bit
      - --served-model-name
      - gemma-4-26b-a4b
      - --tensor-parallel-size
      - "1"
      - --kv-cache-dtype
      - int8_per_token_head
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.96"
      - --max-num-seqs
      - "256"
      - --max-num-batched-tokens
      - "8192"
      - --limit-mm-per-prompt
      - '{"image":0,"audio":0}'
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --chat-template
      - /etc/mail-triage-gemma/chat-template.jinja
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --long-prefill-token-threshold
      - "2048"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
