services:
  mail-triage:
    build: .
    # Stable tag: docker-compose.second.yml (a second instance) reuses this image.
    image: mail-triage:local
    container_name: mail-triage
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8097:8097"
      # OAuth callback ports for tailnet-mode accounts (Tailscale Serve maps
      # https://<node>:4181x to host 127.0.0.1:4181x). Loopback-mode accounts
      # complete via the paste-back box and do not need these.
      - "127.0.0.1:41810-41819:41810-41819"
    environment:
      # local (CPU/ONNX) embedding + reranker models for the lite RAG backend
      FASTEMBED_CACHE_PATH: /ragmodels
    volumes:
      - ./data:/data
      - ./ragmodels:/ragmodels
