# Fusion sidecar for Mail Triage's Fusion Lab plugin.
#
#   docker compose -f fusion/docker-compose.yml up -d --build
#
# The 2B needs to be served separately (any OpenAI-compatible endpoint), e.g.
# the repo's llama.cpp helper:
#   benchmarks/serving/serve_llamacpp.sh /path/to/MiniCPM5-2B-Q4_K_M.gguf minicpm5-2b 8042 32768 4 --no-reasoning-preserve
# For the fusion prompt note that thinking is disabled per request; no extra
# server flags are needed.
#
# The TinyJev model is baked into the image; the port opens immediately while
# the model loads in the background (~8s), /healthz returns 503 until ready.
#
# The service joins the app's compose network (mail-triage_default) with the
# alias "fusion" so the plugin's default http://fusion:8098 resolves from
# inside the mail-triage container. Start the app stack first (it creates the
# network); set MT_NETWORK if your app project uses another name.
services:
  fusion:
    build: .
    image: mail-triage-fusion:latest
    container_name: mail-triage-fusion
    ports:
      - "127.0.0.1:8098:8098"
    environment:
      FUSION_LLM_BASE_URL: "${FUSION_LLM_BASE_URL:-http://host.docker.internal:8042/v1}"
      FUSION_LLM_MODEL: "${FUSION_LLM_MODEL:-minicpm5-2b}"
      FUSION_USER_NAME: "${FUSION_USER_NAME:-Sean}"
      TINYJEV_DEVICE: "cpu"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8098/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  mt:
    name: ${MT_NETWORK:-mail-triage_default}
    external: true
